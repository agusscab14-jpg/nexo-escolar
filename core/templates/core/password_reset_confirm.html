<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definir contraseña · Nexo Escolar</title><body style="font:16px system-ui;max-width:520px;margin:8vh auto;padding:24px;color:#183d37"><h1>Definí tu contraseña</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.non_field_errors }}<p><label>Nueva contraseña {{ form.new_password1 }}</label></p><p><label>Repetí la contraseña {{ form.new_password2 }}</label></p><button>Guardar contraseña</button></form>{% else %}<p>El enlace venció o ya fue utilizado. Pedí uno nuevo.</p><a href="/accounts/password_reset/">Solicitar enlace</a>{% endif %}</body></html>
