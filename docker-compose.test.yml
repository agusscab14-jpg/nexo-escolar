services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexo_test
      POSTGRES_USER: nexo_owner
      POSTGRES_PASSWORD: test-owner-password
      NEXO_DB_USER: nexo_app
      NEXO_DB_PASSWORD: test-app-password
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
  test:
    build: .
    entrypoint: ["sh", "-ec"]
    command:
      - |
        python manage.py migrate --noinput
        python manage.py check
        python manage.py makemigrations --check --dry-run
        python manage.py test
    environment:
      DJANGO_SECRET_KEY: disposable-postgresql-test-key
      DJANGO_DEBUG: "1"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DATABASE_URL: postgresql://nexo_owner:test-owner-password@db:5432/nexo_test
      MIGRATION_DATABASE_URL: postgresql://nexo_owner:test-owner-password@db:5432/nexo_test
    depends_on:
      db:
        condition: service_healthy
volumes:
  test-postgres-data:
