services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: ${POSTGRES_USER:-nexo_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-owner-password}
      NEXO_DB_USER: ${NEXO_DB_USER:-nexo_app}
      NEXO_DB_PASSWORD: ${NEXO_DB_PASSWORD:-change-this-app-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://${NEXO_DOMAIN}}
      DJANGO_SECURE_COOKIES: "1"
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      TIME_ZONE: ${TIME_ZONE:-America/Argentina/Buenos_Aires}
      DATABASE_URL: postgresql://${NEXO_DB_USER:-nexo_app}:${NEXO_DB_PASSWORD:-change-this-app-password}@db:5432/nexo
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-nexo_owner}:${POSTGRES_PASSWORD:-change-this-owner-password}@db:5432/nexo
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Nexo Escolar <no-reply@nexo.local>}
      NEXO_WHATSAPP_NUMBER: ${NEXO_WHATSAPP_NUMBER:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - collected-static:/app/collected-static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto':'https'}), timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:?Set NEXO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - collected-static:/srv/nexo-static:ro
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-owner-password}
      POSTGRES_USER: ${POSTGRES_USER:-nexo_owner}
      POSTGRES_DB: nexo
    volumes:
      - ./backups:/backups
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc > "/backups/.nexo-$$stamp.dump.tmp"
          mv "/backups/.nexo-$$stamp.dump.tmp" "/backups/nexo-$$stamp.dump"
          chown 1000:1000 "/backups/nexo-$$stamp.dump"
          chmod 600 "/backups/nexo-$$stamp.dump"
          find /backups -type f -name 'nexo-*.dump' -mtime +14 -delete
          sleep 86400
        done
volumes:
  postgres-data:
  collected-static:
  caddy-data:
  caddy-config:
